<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Оберіть сухі або рідкі маринади." />
    <title>Каталог маринадів — Маринад Ко.</title>
  </head>
  <body data-page="catalog">
    <div id="site-header"></div>
    <main class="page">
      <section class="container">
        <p class="eyebrow">Демонстраційний каталог</p>
        <h1>Оберіть тип маринаду</h1>
        <div class="category-grid">
          <article class="category-card">
            <div class="category-card__mark" aria-hidden="true">С</div>
            <h2 class="category-card__title">Сухі маринади</h2>
            <p>Сухі суміші приправ для курки, свинини та риби.</p>
            <a class="button" href="./dry.html">Переглянути сухі маринади</a>
          </article>
          <article class="category-card">
            <div class="category-card__mark" aria-hidden="true">Р</div>
            <h2 class="category-card__title">Рідкі маринади</h2>
            <p>Рідкі маринади для курки, свинини та риби.</p>
            <a class="button" href="./liquid.html">Переглянути рідкі маринади</a>
          </article>
        </div>
      </section>
    </main>
    <div id="chat-root"></div>
    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
